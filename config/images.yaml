# Proxmox Image Factory
# Example x86_64/amd64 configuration. Verify storage and bridge before first use.
#
# Two-slot rolling updates:
#   slots[0] and slots[1] alternate as current and previous.
#   A new image becomes current only after passing the QEMU Guest Agent smoke test.
#
# checksum_url points to the distribution's official checksum file. The builder
# extracts the checksum matching image_url and does not rely on Last-Modified.

global:
  storage: local-lvm
  bridge: vmbr0

  # Minimal template resources; newvm overrides these after cloning.
  template_memory_mb: 1024
  template_cores: 1

  # newvm defaults
  default_memory_mb: 2048
  default_cores: 2
  default_disk_gb: 32

  # build/test
  smoke_timeout_sec: 240
  shutdown_timeout_sec: 60

  # Official cloud images are usually current. false reduces build failures.
  # Set to true to run a full apt/dnf upgrade during the build.
  update_packages: false

  # With discard enabled, guest-agent can run fstrim after cloning.
  agent: "enabled=1,fstrim_cloned_disks=1"

images:
  debian-13:
    enabled: true
    slots: [9000, 9001]
    template_name: debian-13
    default_user: debian
    family: debian
    image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
    checksum_url: https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS
    checksum_algo: sha512
    packages:
      - qemu-guest-agent
      - curl
      - ca-certificates
      - vim

  ubuntu-26.04:
    enabled: true
    slots: [9010, 9011]
    template_name: ubuntu-26.04
    default_user: ubuntu
    family: debian
    image_url: https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-amd64.img
    checksum_url: https://cloud-images.ubuntu.com/releases/resolute/release/SHA256SUMS
    checksum_algo: sha256
    packages:
      - qemu-guest-agent
      - curl
      - ca-certificates
      - vim

  centos-stream-10:
    enabled: false
    slots: [9020, 9021]
    template_name: centos-stream-10
    default_user: cloud-user
    family: rhel
    image_url: https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-10-latest.x86_64.qcow2
    checksum_url: https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-10-latest.x86_64.qcow2.SHA256SUM
    checksum_algo: sha256
    packages:
      - qemu-guest-agent
      - curl
      - ca-certificates
      - vim

  archlinux:
    enabled: false
    slots: [9030, 9031]
    template_name: archlinux
    default_user: arch
    family: arch
    image_url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
    checksum_url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2.SHA256
    checksum_algo: sha256
    packages:
      - qemu-guest-agent
      - curl
      - ca-certificates
      - vim
